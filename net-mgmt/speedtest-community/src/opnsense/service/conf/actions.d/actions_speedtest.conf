[version]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py version
parameters:
type:script_output
message: Displays speedtest version

[serverlist]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py list
parameters:
type:script_output
message: List nearest speedtest servers (json)

[run]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py
parameters: %s
type:script_output
message: Run speedtest with or without server id(json)
description: Run speedtest [serverid]

[scheduled]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/scheduled.py run
parameters:
type:script_output
message: Run scheduled speedtest against the best ranked server
description: Run scheduled speedtest

[servers]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/scheduled.py servers
parameters:
type:script_output
message: Show the ranking of the scheduled speedtest servers

[showstat]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py stat
parameters: 
type:script_output
message: Shows speedtest statistics

[showlog]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py log
parameters: 
type:script_output
message: Shows speedtest log (last 50 entries)

[showrecent]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py recent
parameters: 
type:script_output
message: Shows speedtest most recent log entry

[deletelog]
command:/bin/rm /usr/local/opnsense/scripts/OPNsense/speedtest/speedtest.csv
parameters: 
type:script_output
message: Delete the csv log file

[install-http]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/speedtest/install_speedtest.sh http
parameters: 
type:script_output
message: Install speedtest-cli (no longer maintained, not offered on the page)

[install-socket]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/speedtest/install_speedtest.sh socket
parameters: 
type:script_output
message: Install the Ookla speedtest CLI

[setshaper]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/speedtest/shaper.php set
parameters:%s
type:script_output
message: Set shaper bandwidth from speedtest results
description: Set shaper bandwidth from speedtest results

[createshaper]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/speedtest/shaper.php create
parameters:
type:script_output
message: Create shaper pipes, queues and rules for speedtest

[mssshaper]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/speedtest/shaper.php mss
parameters:
type:script_output
message: Show the MSS clamping of the speedtest shaper interface

[setmss]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/speedtest/shaper.php setmss
parameters:
type:script_output
message: Set MSS clamping on the speedtest shaper interface

[syncshaper]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/speedtest/shaper.php sync
parameters:
type:script_output
message: Update the interface address excluded by the speedtest shaper rules

[shaperhistory]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/speedtest/shaper.php history
parameters:%s
type:script_output
message: Show the updates of the speedtest shaper pipes

[clearshaperhistory]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/speedtest/shaper.php clearhistory
parameters:
type:script_output
message: Clear the updates of the speedtest shaper pipes
