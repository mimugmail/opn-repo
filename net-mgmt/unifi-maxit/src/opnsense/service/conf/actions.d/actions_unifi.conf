[start]
command:/usr/local/etc/rc.d/unifi start
parameters:
type:script
message:starting Unifi 
description:Start Unifi

[stop]
command:/usr/local/etc/rc.d/unifi stop
parameters:
type:script
message:stopping Unifi 
description:Stop Unifi

[restart]
command:/usr/local/etc/rc.d/unifi restart
parameters:
type:script
message:restarting Unifi 
description:Restart Unifi

[status]
command:/usr/local/etc/rc.d/unifi status;exit 0
parameters:
type:script_output
message:request Unifi status

[truncate_log]
command:/usr/bin/truncate -s 0 /var/log/unifi/unifi_mongod.log /var/log/unifi/server.log /var/log/unifi/mongod.log 2>/dev/null; echo "Logs truncated"
parameters:
type:script_output
message:Truncating UniFi logs
description:Truncate UniFi logs

[compact_db]
command:/usr/local/bin/mongo --eval "db.runCommand({compact: 'session'})" 127.0.0.1:27117/ace 2>/dev/null || echo "Database compaction triggered"
parameters:
type:script_output
message:Compacting UniFi database
description:Compact UniFi database

[version]
command:/usr/local/opnsense/scripts/OPNsense/Unifi/version.sh
parameters:
type:script_output
message:Get UniFi version
description:Get installed UniFi version

